[package]
name = "codv-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "CodVRuntime"
crate-type = ["cdylib", "rlib"]

[dependencies]
codv-core = { path = "../codv-core" }
codv-engine = { path = "../codv-engine" }
glam = "0.33.2"
codv-gtaworld = { path = "../codv-gtaworld" }
codv-mw2data = { path = "../codv-mw2data", default-features = false }
xmodel_runtime = { path = "../../build/overlay/iw4l/crates/xmodel_runtime" }
hud_iw4 = { path = "../../build/overlay/iw4l/crates/hud_iw4" }
weapon_iw4 = { path = "../../build/overlay/iw4l/crates/weapon_iw4" }
playerstate_iw4 = { path = "../../build/overlay/iw4l/crates/playerstate_iw4" }

[dev-dependencies]
codv-gtaworld = { path = "../codv-gtaworld", features = ["fake"] }
