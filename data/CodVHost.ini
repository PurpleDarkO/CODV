; CODV host data: the GTA names the host uses. Installed beside GTA5.exe;
; edit freely, then restart GTA. tools/check-data.py checks every shipped
; name against GTA's real lists (DurtyFree gta-v-data-dumps).

[Melee]
; Quick melee (C / R3): played on the upper body so the legs keep moving.
;   clip = anim dictionary, clip
clip = melee@knife@streamed_core_fps, knife_short_range_0

[Crouch]
; Crouch (Ctrl / L3): GTA movement and strafe clipsets.
movement = move_crouch_proto
strafe = move_aim_strafe_crouch_2h

[Sounds]
; Hitmarker sounds: name, sound set (PLAY_SOUND_FRONTEND). Leave a key empty
; for silence; the in-game menu's "Hit sounds" turns them all off.
hit = Target_Hit_Body_Black, DLC_GR_Bunker_Shooting_Range_Sounds
headshot = Target_Hit_Head_Black, DLC_GR_Bunker_Shooting_Range_Sounds
kill = Target_Hit_Head_Red, DLC_GR_Bunker_Shooting_Range_Sounds
